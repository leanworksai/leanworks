name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select commits to scan
        id: commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${PR_BASE_SHA}..${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "range=${PUSH_HEAD_SHA}^..${PUSH_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${PUSH_BEFORE_SHA}..${PUSH_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits with Gitleaks
        env:
          GITLEAKS_RANGE: ${{ steps.commits.outputs.range }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo \
            --log-opts="$GITLEAKS_RANGE" \
            --redact=100 \
            --no-banner \
            --no-color

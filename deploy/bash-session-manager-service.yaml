apiVersion: v1
kind: Service
metadata:
  name: bash-session-manager-service
  namespace: default
  labels:
    app: bash-session-manager
spec:
  type: ClusterIP
  selector:
    app: bash-session-manager
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None

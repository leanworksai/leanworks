steps:
  # Step 1: Build the bash session Docker image (used for bash tool in Kubernetes)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building bash session image..."
        docker build \
          -t ${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:${_IMAGE_TAG} \
          -f deploy/Dockerfile.bash-session \
          .
    id: 'build-bash-session-image'

  # Step 2: Push bash session image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:${_IMAGE_TAG}'
    id: 'push-bash-session-image'

  # Step 3: Tag bash session with 'latest'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'tag'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:${_IMAGE_TAG}'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:latest'
    id: 'tag-bash-session-latest'

  # Step 4: Push bash session 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:latest'
    id: 'push-bash-session-latest'

  # Step 5: Build the main ask-api Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building Docker image..."
        docker build \
          -t ${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG} \
          -f deploy/Dockerfile \
          .
    id: 'build-image'
    waitFor: ['push-bash-session-latest']

  # Step 6: Push the main Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG}'
    id: 'push-image'

  # Step 7: Tag with 'latest' for convenience
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'tag'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG}'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'
    id: 'tag-latest'

  # Step 8: Push the 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'
    id: 'push-latest'

# Store the built images in Artifact Registry
images:
  - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:${_IMAGE_TAG}'
  - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/leanworks-bash-session:latest'
  - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:${_IMAGE_TAG}'
  - '${_REGISTRY}/${PROJECT_ID}/${_REPO_NAME}/${_IMAGE_NAME}:latest'

# Build options
options:
  logging: LEGACY  # LEGACY enables live streaming logs to console
  machineType: 'E2_HIGHCPU_8'
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET  # Required when using custom service account

# Substitutions that will be provided when triggering the build
substitutions:
  _IMAGE_TAG: 'latest'
  _REGISTRY: 'us-west1-docker.pkg.dev'
  _REPO_NAME: 'leanworks-docker-images'
  _IMAGE_NAME: 'ask-api'

# Timeout for the entire build
timeout: '1200s'
